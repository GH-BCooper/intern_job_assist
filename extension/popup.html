<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Add to InternTrack</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        width: 268px;
        padding: 16px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #FEF7EC;
        color: #231C11;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1B170E; color: #F7F1E8; }
        input { background: #2A2417; color: #F7F1E8; border-color: #3A3324; }
      }
      h1 { margin: 0 0 4px; font-size: 14px; }
      p { margin: 0 0 12px; font-size: 11.5px; opacity: .72; }
      button {
        width: 100%;
        padding: 9px 12px;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(135deg, #FB923C, #FF7E7E);
        color: #fff;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled { opacity: .6; cursor: default; }
      label { display: block; margin: 12px 0 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
      input {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid #F3E7D3;
        border-radius: 8px;
        font-size: 11.5px;
        box-sizing: border-box;
      }
      .status { margin-top: 10px; font-size: 11px; min-height: 14px; }
    </style>
  </head>
  <body>
    <h1>Add to InternTrack</h1>
    <p>Reads the posting this tab publishes about itself and opens it prefilled.</p>
    <button id="capture">Capture this page</button>
    <label for="origin">Your InternTrack URL</label>
    <input id="origin" type="url" placeholder="https://intern-job-assist.vercel.app" />
    <p class="status" id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
